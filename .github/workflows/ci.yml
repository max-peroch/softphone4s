name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build:
    # The library runs on Java 17 and later (it is compiled with -release 17),
    # so it is tested on 17. Everything else, the Opus module included, needs
    # the Foreign Function & Memory API of Java 22 and later, and is built and
    # tested on 25. Zulu, for a release that has the fix for CVE-2026-91403.
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth:  0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting
        if: matrix.java == '25'
        run: sbt "scalafmtSbtCheck;scalafmtCheckAll;softphone4sInterop/scalafmtCheckAll"

      - name: Compile the interop tests
        if: matrix.java == '25'
        run: sbt softphone4sInterop/Test/compile

      - name: Test the library
        if: matrix.java == '17'
        run: sbt "softphone4s/testFull;softphone4sOtel4s/testFull"

      - name: Test everything
        if: matrix.java == '25'
        run: sbt testFull

      - name: Generate documentation
        if: matrix.java == '25'
        run: sbt doc

      # Before 1.0 a release may break compatibility, so this reports and does
      # not fail the build. The report is what MIGRATION.md is written from.
      - name: Report binary compatibility with the last release
        if: matrix.java == '25'
        continue-on-error: true
        run: sbt "softphone4s/mimaReportBinaryIssues;softphone4sOtel4s/mimaReportBinaryIssues"

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Publish
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

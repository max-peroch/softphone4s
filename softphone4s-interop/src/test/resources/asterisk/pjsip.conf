[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[alice]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=alice
aors=alice
direct_media=no
force_rport=yes
rewrite_contact=yes
allow_subscribe=yes
subscribe_context=default
message_context=messages

[alice]
type=auth
auth_type=userpass
username=alice
password=alicepw

[alice]
type=aor
max_contacts=1
remove_existing=yes
; the mailbox a solicited message-summary subscription to alice is about
mailboxes=alice@default

[bob]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=bob
aors=bob
direct_media=no
force_rport=yes
rewrite_contact=yes
allow_subscribe=yes
subscribe_context=default
message_context=messages

[bob]
type=auth
auth_type=userpass
username=bob
password=bobpw

[bob]
type=aor
max_contacts=1
remove_existing=yes

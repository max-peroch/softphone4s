[default]
exten => alice,hint,PJSIP/alice
exten => bob,hint,PJSIP/bob
exten => carol,hint,Custom:carol
exten => _X.,1,Answer()
 same => n,Playback(silence/1)
 same => n,Hangup()

[messages]
exten => _.,1,NoOp(MESSAGE from ${MESSAGE(from)} to ${MESSAGE(to)})
 same => n,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,Hangup()
